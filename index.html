<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch Video</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1c1b19;--muted:#6b6962;--accent:#2f5bea;--border:#e2e0da;--err:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#1f1f1f;--text:#f1efe9;--muted:#9a978f;--accent:#7b9bff;--border:#333;--err:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--card:#1f1f1f;--text:#f1efe9;--muted:#9a978f;--accent:#7b9bff;--border:#333;--err:#ff7b6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:720px}
h1{font-size:1.3rem;margin:0 0 6px}
p{color:var(--muted);margin:0 0 16px;line-height:1.45;font-size:.95rem}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;margin-bottom:12px}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:1rem;cursor:pointer;width:100%}
video{width:100%;max-height:75vh;border-radius:12px;background:#000;display:block}
.msg{font-size:.9rem;margin-top:10px;min-height:1.2em;color:var(--muted);word-break:break-all}
.err{color:var(--err)}
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
/* ===== CONFIG: edit these two lines ===== */
var VIDEO_FILE = "video.mp4";   // file name of the video in the same repo folder
var PASSWORD_HASH = "";         // paste the hash from  yoursite/#setup  (empty = no password)
var TITLE = "Private video";
/* ======================================== */

var app = document.getElementById('app');
async function sha(s){
  var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('pv-salt:' + s));
  return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
}
function el(t,p,k){var e=document.createElement(t);for(var a in (p||{}))e[a]=p[a];(k||[]).forEach(function(c){e.appendChild(c)});return e;}

function player(){
  app.innerHTML='';
  var v = el('video',{controls:true,playsInline:true,preload:'metadata',src:VIDEO_FILE});
  app.append(el('h1',{textContent:TITLE}), v);
}
function gate(){
  app.innerHTML='';
  var pw = el('input',{type:'password',placeholder:'Password',autocomplete:'current-password'});
  var msg = el('div',{className:'msg'});
  async function go(){
    if(await sha(pw.value) === PASSWORD_HASH) player();
    else { msg.className='msg err'; msg.textContent='Wrong password.'; }
  }
  pw.onkeydown = function(e){ if(e.key==='Enter') go(); };
  app.append(el('h1',{textContent:TITLE}), el('p',{textContent:'Enter the password to watch.'}), pw, el('button',{textContent:'Unlock',onclick:go}), msg);
}
function setup(){
  app.innerHTML='';
  var pw = el('input',{type:'text',placeholder:'Type your chosen password'});
  var out = el('div',{className:'msg'});
  app.append(el('h1',{textContent:'Password setup'}), el('p',{textContent:'Type a password, copy the hash, and paste it into PASSWORD_HASH in index.html.'}), pw,
    el('button',{textContent:'Generate hash',onclick:async function(){ out.className='msg'; out.textContent = await sha(pw.value); }}), out);
}

if(location.hash === '#setup') setup();
else if(PASSWORD_HASH) gate();
else player();
</script>
</body>
</html>
