<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>Private Screening</title>
<style>
:root{--bg:#0b0c10;--bg2:#151826;--card:rgba(255,255,255,.06);--text:#f4f4f8;--muted:#9aa0b4;--accent:#7c8cff;--accent2:#c27bff;--border:rgba(255,255,255,.12);--err:#ff6b7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f4fb;--bg2:#e4e7fb;--card:rgba(255,255,255,.8);--text:#161827;--muted:#5d6280;--accent:#4a5cf0;--accent2:#9a4cf0;--border:rgba(20,24,60,.12);--err:#d63a4c;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f4fb;--bg2:#e4e7fb;--card:rgba(255,255,255,.8);--text:#161827;--muted:#5d6280;--accent:#4a5cf0;--accent2:#9a4cf0;--border:rgba(20,24,60,.12);--err:#d63a4c;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1000px 600px at 20% -10%,var(--bg2),transparent 60%),radial-gradient(800px 500px at 100% 110%,var(--bg2),transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
.card{width:100%;max-width:760px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px 24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.35);animation:rise .5s ease both}
.card.narrow{max-width:380px;text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lock{width:56px;height:56px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px rgba(124,140,255,.4)}
h1{font-size:1.4rem;margin:0 0 6px;letter-spacing:-.01em}
p{color:var(--muted);margin:0 0 22px;font-size:.95rem;line-height:1.45}
.pins{display:flex;gap:12px;justify-content:center;margin-bottom:12px}
.pins input{width:56px;height:68px;text-align:center;font-size:1.8rem;font-weight:600;border-radius:16px;border:1.5px solid var(--border);background:var(--card);color:var(--text);outline:none;transition:border-color .15s,transform .15s,box-shadow .15s;-webkit-text-security:disc}
.pins input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,140,255,.22);transform:translateY(-2px)}
.pins.shake{animation:shake .4s}
.pins.shake input{border-color:var(--err)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.msg{min-height:1.3em;font-size:.9rem;color:var(--muted);margin-top:6px;word-break:break-all}
.err{color:var(--err)}
.player{border-radius:16px;overflow:hidden;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.45)}
video{width:100%;max-height:72vh;display:block;background:#000}
.head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.dot{width:10px;height:10px;border-radius:50%;background:#3ddc84;box-shadow:0 0 10px #3ddc84}
.head h1{margin:0;font-size:1.15rem}
input.txt{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1rem;margin-bottom:12px}
